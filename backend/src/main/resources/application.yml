server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: civicpulse-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civicpulse_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# Application specific configurations
app:
  jwt:
    # 256-bit Hex secret for HMAC-SHA256 (safe default for local development)
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24 hours
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  sla:
    escalation-cron: ${APP_SLA_ESCALATION_CRON:0 */15 * * * *}

logging:
  level:
    root: INFO
    com.civicpulse: DEBUG
    org.springframework.security: INFO
